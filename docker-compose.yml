version: '3.8'

services:
  # PostgreSQL Database Service
  db:
    image: postgres:16-alpine
    container_name: tempo_db
    restart: always
    environment:
      POSTGRES_DB: ${DB_NAME:-tempo_db}
      POSTGRES_USER: ${DB_USER:-tempo_user}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-tempo_secure_password}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Tempo Node.js Application
  app:
    build: .
    container_name: tempo_app
    restart: always
    depends_on:
      db:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 3000
      DATABASE_URL: postgresql://${DB_USER:-tempo_user}:${DB_PASSWORD:-tempo_secure_password}@db:5432/${DB_NAME:-tempo_db}
      JWT_SECRET: ${JWT_SECRET:-tempo_production_jwt_secret_key_change_me}
      JWT_EXPIRES_IN: 7d
    ports:
      - "3000:3000"

volumes:
  postgres_data:
    driver: local
